databaseChangeLog:
  - changeSet:
      id: 037-appointment-question
      author: nutriconsultas
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: appointment_question
      changes:
        - createTable:
            tableName: appointment_question
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: paciente_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false
              - column:
                  name: answered
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: answered_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: appointment_question
            baseColumnNames: paciente_id
            referencedTableName: paciente
            referencedColumnNames: id
            constraintName: fk_appointment_question_paciente
        - createIndex:
            indexName: idx_appointment_question_paciente_id
            tableName: appointment_question
            columns:
              - column:
                  name: paciente_id
        - createIndex:
            indexName: idx_appointment_question_paciente_answered
            tableName: appointment_question
            columns:
              - column:
                  name: paciente_id
              - column:
                  name: answered
